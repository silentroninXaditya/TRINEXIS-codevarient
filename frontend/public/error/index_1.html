<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Lost in the Deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
/* =====================================================
   SETUP
   Put these two images next to this file:
     surface.jpg    -> the sky + waves + underwater picture
     graveyard.jpg  -> the full underwater graveyard picture
   ===================================================== */
:root {
  --transition: 4s;                       /* sky -> graveyard length */
  --ease: cubic-bezier(.65, 0, .35, 1);   /* smooth in-out */
  --glow: #7fe8ff;
  --text-start: 3.2s;                     /* when the 404 starts appearing */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #02070c;
  font-family: 'Inter', system-ui, sans-serif;
  color: #d8f4ff;
}

@media (pointer: fine) {
  body, a, button { cursor: none; }
}

.scene { position: fixed; inset: 0; overflow: hidden; }

/* every layer that parallax moves is slightly oversized so edges never show */
.layer {
  position: absolute;
  inset: -5%;
  will-change: transform;
}

/* ---------- BG 1: SLOW OCEAN ZOOM ---------- */
.zoom {
  position: absolute;
  inset: 0;
  transform-origin: 60% 70%;
  animation: oceanZoom 40s ease-in-out infinite alternate;
}
@keyframes oceanZoom {
  from { transform: scale(1); }
  to   { transform: scale(1.14); }
}

.bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;
}

/* deep graveyard (final state) */
.bg-deep {
  background-image: url('graveyard.jpg');
  background-color: #03101a;
  opacity: 0;
  animation: emerge var(--transition) var(--ease) forwards;
}
@keyframes emerge {
  0%   { opacity: 0; transform: scale(1.1); filter: brightness(1.5) blur(3px); }
  100% { opacity: 1; transform: scale(1);   filter: brightness(1)   blur(0); }
}

/* surface (starting state), sinks away while the deep fades in */
.bg-surface {
  background-image: url('surface.jpg');
  background-color: #0b1824;
  transform-origin: 50% 100%;
  -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
  animation: descend var(--transition) var(--ease) forwards;
}
@keyframes descend {
  0%   { opacity: 1;   transform: translateY(0)    scale(1);    filter: blur(0)   brightness(1); }
  55%  { opacity: .8; }
  100% { opacity: 0;   transform: translateY(-28%) scale(1.12); filter: blur(8px) brightness(.45); }
}

/* the waterline that slides up as the camera dives */
.waterline {
  position: absolute;
  left: 0; right: 0;
  top: 44%;
  height: 8px;
  background: linear-gradient(90deg, transparent, rgba(190, 235, 255, .65), transparent);
  filter: blur(4px);
  opacity: 0;
  animation: waterline var(--transition) var(--ease) forwards;
}
@keyframes waterline {
  0%   { transform: translateY(0);     opacity: .9; }
  70%  { opacity: .25; }
  100% { transform: translateY(-60vh); opacity: 0; }
}

/* blue-green tint that thickens as you go under */
.dive-tint {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(10, 60, 85, 0), rgba(4, 22, 34, .55));
  opacity: 0;
  animation: tint var(--transition) ease-in-out forwards;
}
@keyframes tint { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: .25; } }

/* ---------- BG 3: ANIMATED LIGHT RAYS ---------- */
.rays-wrap {
  position: absolute;
  inset: 0;
  opacity: 0;
  animation: fadeIn var(--transition) ease-in forwards;
  mix-blend-mode: screen;
  pointer-events: none;
}
@keyframes fadeIn { to { opacity: 1; } }

.rays, .rays::after {
  content: '';
  position: absolute;
  inset: -20% -15% 25% -15%;
  transform-origin: 50% 0;
  background: repeating-linear-gradient(
    102deg,
    transparent 0 7%,
    rgba(110, 215, 255, .13) 9%,
    transparent 13% 19%,
    rgba(150, 235, 255, .09) 22%,
    transparent 26% 33%
  );
  -webkit-mask-image: linear-gradient(to bottom, #000, transparent 80%);
          mask-image: linear-gradient(to bottom, #000, transparent 80%);
  filter: blur(6px);
  animation: raySway 16s ease-in-out infinite alternate;
}
.rays::after {
  inset: 0;
  opacity: .7;
  transform: scaleX(-1);
  animation-duration: 23s;
  animation-direction: alternate-reverse;
}
@keyframes raySway {
  0%   { transform: translateX(-5%) skewX(-7deg); opacity: .55; }
  50%  { opacity: 1; }
  100% { transform: translateX(5%)  skewX(7deg);  opacity: .6; }
}

/* ---------- BG 4: MOVING FOG ---------- */
.fog {
  position: absolute;
  left: 0; top: 0;
  width: 200%;
  height: 100%;
  background-size: 50% 100%;
  background-repeat: repeat-x;
  filter: blur(18px);
  pointer-events: none;
  opacity: 0;
}
.fog-1 {
  background-image:
    radial-gradient(ellipse 55% 35% at 25% 70%, rgba(90, 150, 170, .20), transparent 70%),
    radial-gradient(ellipse 45% 30% at 75% 45%, rgba(70, 120, 150, .15), transparent 70%);
  animation: fogDrift 70s linear infinite, fogIn 5s 2s ease-out forwards;
}
.fog-2 {
  top: 12%;
  background-image:
    radial-gradient(ellipse 50% 28% at 40% 60%, rgba(120, 190, 210, .13), transparent 70%),
    radial-gradient(ellipse 40% 25% at 90% 35%, rgba(60, 110, 140, .14), transparent 70%);
  animation: fogDrift 110s linear infinite reverse, fogIn 5s 2.5s ease-out forwards;
}
@keyframes fogDrift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes fogIn    { to { opacity: .6; } }   /* fog strength: lower = less fog */

/* ---------- vignette ---------- */
.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 55%, transparent 35%, rgba(0, 5, 10, .75) 100%);
  pointer-events: none;
}

/* ---------- BG 5: PARTICLES (canvas) ---------- */
#particles {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ---------- BG 6: BUBBLES ---------- */
#bubbles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 5;
}
.bubble {
  position: absolute;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 28%, rgba(255, 255, 255, .85) 0 8%, transparent 22%),
    radial-gradient(circle at 50% 50%, rgba(140, 225, 255, .05) 55%, rgba(140, 225, 255, .35) 100%);
  border: 1px solid rgba(170, 235, 255, .35);
  box-shadow: inset 0 0 6px rgba(150, 230, 255, .25), 0 0 8px rgba(100, 210, 255, .15);
  will-change: transform, opacity;
  animation: bubbleRise var(--dur, 8s) linear forwards;
}
@keyframes bubbleRise {
  0%   { transform: translate(0, 0) scale(.6);                                opacity: 0; }
  10%  { opacity: .9; transform: translate(0, calc(var(--rise) * -.1)) scale(1); }
  35%  { transform: translate(var(--sway),         calc(var(--rise) * -.35)); }
  65%  { transform: translate(calc(var(--sway) * -.6), calc(var(--rise) * -.65)); }
  100% { transform: translate(calc(var(--sway) * .4),  calc(var(--rise) * -1)) scale(1.1); opacity: 0; }
}

/* ---------- CURSOR ---------- */
.cursor-ring, .cursor-dot {
  position: fixed;
  left: 0; top: 0;
  pointer-events: none;
  z-index: 50;
  border-radius: 50%;
  opacity: 0;
  transition: opacity .4s, width .25s, height .25s, background .25s, border-color .25s;
}
.cursor-ring {
  width: 34px; height: 34px;
  margin: -17px 0 0 -17px;
  border: 1.5px solid rgba(140, 235, 255, .6);
  box-shadow: 0 0 18px rgba(90, 210, 255, .35), inset 0 0 10px rgba(90, 210, 255, .2);
  mix-blend-mode: screen;
}
.cursor-dot {
  width: 6px; height: 6px;
  margin: -3px 0 0 -3px;
  background: #bff4ff;
  box-shadow: 0 0 12px 2px rgba(120, 225, 255, .8);
}
body.cursor-on .cursor-ring, body.cursor-on .cursor-dot { opacity: 1; }
body.cursor-hover .cursor-ring {
  width: 58px; height: 58px;
  margin: -29px 0 0 -29px;
  background: rgba(100, 215, 255, .1);
  border-color: rgba(190, 245, 255, .9);
}
@media (pointer: coarse) { .cursor-ring, .cursor-dot { display: none; } }

/* =====================================================
   404 CONTENT
   ===================================================== */
.content {
  position: relative;
  z-index: 10;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 24px 4vh;
}

/* ---------- 404 NUMBER ---------- */
.code {
  display: flex;
  gap: clamp(6px, 2vw, 28px);
  font-family: 'Cinzel', 'Times New Roman', serif;
  font-weight: 700;
  font-size: clamp(5.5rem, 22vw, 15rem);
  line-height: 1;
  letter-spacing: .02em;
  color: #dffaff;
}
.digit {
  display: inline-block;
  opacity: 0;
  transform: translateY(50px);
  filter: blur(22px);
  /* 7: number reveal   |   8: glowing text */
  animation:
    reveal 2s cubic-bezier(.2, .75, .25, 1) forwards,
    glow   4.5s ease-in-out infinite alternate;
}
.digit:nth-child(1) { animation-delay: var(--text-start),               calc(var(--text-start) + 2s); }
.digit:nth-child(2) { animation-delay: calc(var(--text-start) + .25s),  calc(var(--text-start) + 2.25s); }
.digit:nth-child(3) { animation-delay: calc(var(--text-start) + .5s),   calc(var(--text-start) + 2.5s); }

@keyframes reveal {
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes glow {
  0%   { text-shadow: 0 0 8px rgba(127, 232, 255, .35), 0 0 24px rgba(60, 190, 240, .25), 0 0 60px rgba(30, 140, 200, .2); }
  100% { text-shadow: 0 0 14px rgba(160, 240, 255, .9),  0 0 40px rgba(80, 210, 255, .65), 0 0 110px rgba(40, 170, 230, .5); }
}

/* 9: zero pulse (nested so its filter doesn't clash with the reveal blur) */
.pulse {
  display: inline-block;
  animation: zeroPulse 3.2s ease-in-out infinite;
  animation-delay: calc(var(--text-start) + 2.5s);
}
@keyframes zeroPulse {
  0%, 100% { filter: brightness(.8); }
  50%      { filter: brightness(1.55) drop-shadow(0 0 14px rgba(140, 235, 255, .55)); }
}

/* ---------- 10: CONTENT FADE-IN (sequential) ---------- */
.fade-up {
  opacity: 0;
  transform: translateY(18px);
  animation: fadeUp 1.1s ease-out forwards;
}
.subtitle {
  margin-top: clamp(8px, 2vh, 20px);
  font-family: 'Cinzel', serif;
  font-weight: 500;
  font-size: clamp(1.05rem, 2.6vw, 1.9rem);
  letter-spacing: .38em;
  text-transform: uppercase;
  color: #a9ecff;
  text-shadow: 0 0 18px rgba(90, 200, 240, .5);
  animation-delay: calc(var(--text-start) + 1.6s);
}
.desc {
  margin-top: 18px;
  max-width: 520px;
  font-weight: 300;
  font-size: clamp(.95rem, 1.7vw, 1.1rem);
  line-height: 1.7;
  color: rgba(205, 240, 252, .8);
  text-shadow: 0 2px 14px rgba(0, 0, 0, .8);
  animation-delay: calc(var(--text-start) + 2.2s);
}
.btn {
  margin-top: 34px;
  display: inline-block;
  padding: 14px 38px;
  font-family: 'Cinzel', serif;
  font-weight: 500;
  font-size: .95rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  text-decoration: none;
  color: #dffaff;
  border: 1px solid rgba(140, 235, 255, .55);
  border-radius: 999px;
  background: rgba(20, 70, 95, .25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 0 22px rgba(70, 190, 240, .2), inset 0 0 14px rgba(110, 220, 255, .08);
  transition: background .3s, box-shadow .3s, transform .3s, letter-spacing .3s;
  animation-delay: calc(var(--text-start) + 2.9s);
}
.btn:hover, .btn:focus-visible {
  background: rgba(60, 170, 215, .3);
  box-shadow: 0 0 36px rgba(100, 220, 255, .5), inset 0 0 18px rgba(140, 235, 255, .2);
  letter-spacing: .26em;
  outline: none;
}
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* ---------- reduced motion: show the final state, no movement ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01s !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
  }
  .bubble { display: none; }
}
</style>
</head>

<body>
<div class="scene" id="scene">

  <!-- Parallax layer 1: the backgrounds (moves least → looks furthest) -->
  <div class="layer" data-depth="12">
    <div class="zoom">
      <div class="bg bg-deep"></div>
      <div class="bg bg-surface"></div>
      <div class="waterline"></div>
    </div>
  </div>

  <div class="dive-tint"></div>

  <!-- Parallax layer 2: light rays -->
  <div class="layer" data-depth="22">
    <div class="rays-wrap"><div class="rays"></div></div>
  </div>

  <!-- Parallax layer 3: fog -->
  <div class="layer" data-depth="34">
    <div class="fog fog-1"></div>
    <div class="fog fog-2"></div>
  </div>

  <div class="vignette"></div>

  <!-- Parallax layer 4: particles (moves most → looks closest) -->
  <div class="layer" data-depth="52">
    <canvas id="particles"></canvas>
  </div>
</div>

<div id="bubbles"></div>

<main class="content">
  <h1 class="code" aria-label="404">
    <span class="digit">4</span>
    <span class="digit"><span class="pulse">0</span></span>
    <span class="digit">4</span>
  </h1>
  <p class="subtitle fade-up">Lost in the Deep</p>
  <p class="desc fade-up">
    The page you're looking for has sunk beneath the waves.
    It may have been moved, deleted, or never existed at all.
  </p>
  <a class="btn fade-up" href="#" onclick="if(window.parent)window.parent.postMessage({type:'RETURN_TO_MAIN'},'*'); return false;">Return to the Surface</a>
</main>

<div class="cursor-ring"></div>
<div class="cursor-dot"></div>

<script>
(() => {
  'use strict';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine   = window.matchMedia('(pointer: fine)').matches;
  const TRANSITION_MS = 4000;
  const startTime = performance.now();

  /* ---------- shared mouse state ---------- */
  const mouse = { x: innerWidth / 2, y: innerHeight / 2, nx: 0, ny: 0 };

  /* =====================================================
     BG 2 · PARALLAX  (mouse moves each layer by its data-depth)
     ===================================================== */
  const layers = [...document.querySelectorAll('.layer')];
  const par = { x: 0, y: 0 };

  /* =====================================================
     BG 5 · FLOATING PARTICLES (canvas)
     ===================================================== */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const sprite = document.createElement('canvas');   // pre-rendered glow = cheap to draw
  sprite.width = sprite.height = 64;
  (() => {
    const s = sprite.getContext('2d');
    const g = s.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0,   'rgba(220,250,255,1)');
    g.addColorStop(.25, 'rgba(120,225,255,.55)');
    g.addColorStop(1,   'rgba(60,180,230,0)');
    s.fillStyle = g;
    s.fillRect(0, 0, 64, 64);
  })();

  const particles = [];
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function makeParticle(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 20,
      r: 5 + Math.random() * 16,              // sprite size
      vy: .12 + Math.random() * .45,          // rise speed
      sway: 10 + Math.random() * 30,
      phase: Math.random() * Math.PI * 2,
      speed: .0004 + Math.random() * .0012,
      tw: Math.random() * Math.PI * 2,
      base: .15 + Math.random() * .3          /* particle brightness */
    };
  }
  function initParticles() {
    particles.length = 0;
    const n = Math.round(Math.min(40, (W * H) / 36000));   /* particle count */
    for (let i = 0; i < n; i++) particles.push(makeParticle(true));
  }
  addEventListener('resize', () => { resize(); initParticles(); });
  resize(); initParticles();

  /* =====================================================
     BG 6 · BUBBLES (ambient + cursor trail + click burst)
     ===================================================== */
  const bubbleLayer = document.getElementById('bubbles');
  let bubbleCount = 0;
  const MAX_BUBBLES = 70;

  function spawnBubble(x, y, o = {}) {
    if (reduce || bubbleCount >= MAX_BUBBLES) return;
    const b = document.createElement('div');
    const size = o.size ?? (3 + Math.random() * 16);
    b.className = 'bubble';
    b.style.width = b.style.height = size + 'px';
    b.style.left = (x - size / 2) + 'px';
    b.style.top  = (y - size / 2) + 'px';
    b.style.setProperty('--rise', (o.rise ?? (innerHeight * (.35 + Math.random() * .6))) + 'px');
    b.style.setProperty('--sway', ((Math.random() - .5) * (o.sway ?? 70)) + 'px');
    b.style.setProperty('--dur',  (o.dur ?? (6 + Math.random() * 7)) + 's');
    bubbleCount++;
    b.addEventListener('animationend', () => { b.remove(); bubbleCount--; });
    bubbleLayer.appendChild(b);
  }

  // ambient bubbles rising from the sea floor
  function ambient() {
    if (document.hidden) return;
    const elapsed = performance.now() - startTime;
    // during the dive: a denser, faster stream of bubbles
    const diving = elapsed < TRANSITION_MS + 600;
    const count = diving ? 2 : 1;
    for (let i = 0; i < count; i++) {
      spawnBubble(Math.random() * innerWidth, innerHeight + 20, diving ? { dur: 4 + Math.random() * 3 } : {});
    }
  }
  setInterval(ambient, 420);

  // cursor trail
  let lastTrail = 0;
  function trail(x, y) {
    const now = performance.now();
    if (now - lastTrail < 110) return;
    lastTrail = now;
    spawnBubble(x + (Math.random() - .5) * 14, y + (Math.random() - .5) * 14, {
      size: 4 + Math.random() * 9,
      rise: 90 + Math.random() * 160,
      sway: 36,
      dur: 2.4 + Math.random() * 1.6
    });
  }

  // click burst
  addEventListener('pointerdown', e => {
    for (let i = 0; i < 9; i++) {
      spawnBubble(e.clientX + (Math.random() - .5) * 30, e.clientY + (Math.random() - .5) * 30, {
        size: 5 + Math.random() * 16,
        rise: 120 + Math.random() * 260,
        sway: 120,
        dur: 2.5 + Math.random() * 2
      });
    }
  });

  /* =====================================================
     CURSOR (glowing ring that trails a dot)
     ===================================================== */
  const ring = document.querySelector('.cursor-ring');
  const dot  = document.querySelector('.cursor-dot');
  const ringPos = { x: mouse.x, y: mouse.y };

  addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    mouse.nx = e.clientX / innerWidth  - .5;
    mouse.ny = e.clientY / innerHeight - .5;
    document.body.classList.add('cursor-on');
    if (!reduce) trail(e.clientX, e.clientY);
  });
  document.addEventListener('mouseleave', () => document.body.classList.remove('cursor-on'));
  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
  });

  /* =====================================================
     MAIN LOOP
     ===================================================== */
  function frame(t) {
    // parallax: ease toward the mouse position
    par.x += (mouse.nx - par.x) * .06;
    par.y += (mouse.ny - par.y) * .06;
    if (!reduce) {
      for (const el of layers) {
        const d = +el.dataset.depth;
        el.style.transform = `translate3d(${(-par.x * d).toFixed(2)}px, ${(-par.y * d).toFixed(2)}px, 0)`;
      }
    }

    // cursor
    if (fine) {
      ringPos.x += (mouse.x - ringPos.x) * .16;
      ringPos.y += (mouse.y - ringPos.y) * .16;
      ring.style.transform = `translate(${ringPos.x}px, ${ringPos.y}px)`;
      dot.style.transform  = `translate(${mouse.x}px, ${mouse.y}px)`;
    }

    // particles fade in during the dive, then stay
    const elapsed = t - startTime;
    const fade = Math.min(1, Math.max(0, (elapsed - 1500) / 2500));
    ctx.clearRect(0, 0, W, H);
    if (fade > 0) {
      for (const p of particles) {
        p.y -= p.vy;
        p.phase += p.speed * 16;
        p.tw += .02;
        const x = p.x + Math.sin(p.phase) * p.sway;
        if (p.y < -30) Object.assign(p, makeParticle(false));
        const edge = Math.min(1, Math.max(0, p.y / (H * .25)), (H - p.y + 40) / 80);  // soft fade at top/bottom
        ctx.globalAlpha = fade * p.base * (.6 + .4 * Math.sin(p.tw)) * Math.max(0, edge);
        ctx.drawImage(sprite, x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      }
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
